spring.application.name=ecommerce

# Runs with the 'local' profile unless another profile is set (the Docker image sets 'prod')
spring.profiles.default=local

# Platform port (Render/Railway/etc. inject PORT)
server.port=${PORT:8080}

# Database is configured in config/DataSourceConfig from env vars:

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
