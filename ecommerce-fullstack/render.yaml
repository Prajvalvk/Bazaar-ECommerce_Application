services:
  - type: web
    name: ecommerce-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_SIGNUP_CODE
        sync: false
databases:
  - name: ecommerce-db
    plan: free
